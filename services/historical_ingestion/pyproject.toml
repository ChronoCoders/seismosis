[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seismosis-historical-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
description = "Seismosis historical ingestion service — bulk-downloads USGS ComCat catalog for Turkey region into PostgreSQL"
dependencies = [
    "asyncpg>=0.29.0",
    "aiohttp>=3.9.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "asyncpg-stubs>=0.29.0",
    "aioresponses>=0.7.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/historical_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.mypy]
python_version = "3.11"
strict = true
[[tool.mypy.overrides]]
module = ["prometheus_client.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
