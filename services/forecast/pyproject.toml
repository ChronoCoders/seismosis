[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seismosis-forecast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "joblib"]
ignore_missing_imports = true
