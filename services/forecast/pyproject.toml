[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seismosis-forecast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "numpy>=1.26.0",
    "redis>=4.6.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "joblib>=1.3.0",
    "confluent-kafka[avro]>=2.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
log_cli = true
log_cli_level = "INFO"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "joblib", "confluent_kafka.*"]
ignore_missing_imports = true
